<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#155dfc">
    <title>Aureus · You're offline</title>
    <style>
        :root { color-scheme: light dark; --bg: #f8fafc; --fg: #0f172a; --muted: #64748b; --card: #ffffff; --line: rgba(15, 23, 42, .1); --primary: #155dfc; }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #0b1120; --fg: #e2e8f0; --muted: #94a3b8; --card: #111827; --line: rgba(255, 255, 255, .08); }
        }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
            background: var(--bg); color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        main { width: 100%; max-width: 380px; text-align: center; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 32px 24px; }
        svg { display: block; margin: 0 auto; }
        h1 { font-size: 1.35rem; margin: 18px 0 8px; }
        p { margin: 0 0 20px; color: var(--muted); line-height: 1.45; }
        button { font: inherit; font-weight: 600; color: #fff; background: var(--primary); border: 0; border-radius: 12px; padding: 12px 22px; cursor: pointer; width: 100%; }
    </style>
</head>
<body>
    <main>
        <!-- Inline: this page is shown in place of any URL, so relative links would not resolve. -->
        <svg viewBox="0 0 512 512" width="72" height="72" role="img" aria-label="Aureus">
            <rect width="512" height="512" rx="112" fill="#155dfc"/>
            <path fill="#ffffff" fill-rule="evenodd" d="M228 120H284L392 392H330L306 330H206L182 392H120ZM256 190L290 282H222Z"/>
        </svg>
        <h1>You're offline</h1>
        <p>Aureus needs an internet connection. Check-in and check-out are recorded on the server, so connect to Wi-Fi or mobile data and try again.</p>
        <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
</body>
</html>
